# 放到你自己仓库的 .github/workflows/build-wda.yml，然后在 Actions 页手动运行。
# 产物是未签名的 WebDriverAgentRunner.ipa，之后用 Sideloadly 签名并安装到手机。
name: Build WDA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Clone WebDriverAgent
        run: git clone --depth 1 https://github.com/appium/WebDriverAgent.git

      - name: Build for device without code signing
        working-directory: WebDriverAgent
        run: |
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$GITHUB_WORKSPACE/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0
          # WDA 默认部署目标是 12.0，低于 Xcode 27 的最低要求 15.0，会导致构建失败；
          # 手机是 iOS 27，把目标提到 15.0 不影响使用。

      - name: Package ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/WebDriverAgentRunner-Runner.app Payload/
          # Appium 文档建议：预构建真机包要删掉顶层 Frameworks 里的 XC* 副本，
          # 让 XCTest 依赖从手机自带的开发者支持库解析（PlugIns 里的 WebDriverAgentLib 不动）。
          rm -rf Payload/WebDriverAgentRunner-Runner.app/Frameworks/XC*
          zip -qry WebDriverAgentRunner.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgentRunner-ipa
          path: WebDriverAgentRunner.ipa
